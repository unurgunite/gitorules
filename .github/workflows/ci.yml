name: CI

on: [push, pull_request]

jobs:
  check-source:
    if: github.base_ref == 'master'
    uses: FlorexLabs/shared-workflows/.github/workflows/check-source-branch.yml@master

  test:
    strategy:
      fail-fast: false
      # One Crystal version everywhere, so a compiler change never lands
      # on a single OS leg unnoticed.
      matrix:
        crystal: ["1.22.3"]
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ matrix.crystal }}
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-${{ matrix.crystal }}-

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        if: runner.os != 'Windows' && matrix.crystal == '1.22.3'
        run: crystal tool format --check

      - name: Lint
        if: runner.os != 'Windows'
        run: |
          shards build ameba
          bin/ameba

      - name: Lint example config
        if: runner.os != 'Windows' && matrix.crystal == '1.22.3'
        run: |
          crystal build src/gitorules.cr -o gitorules
          ./gitorules lint --config .gitorules.yml.example

      - name: Test
        run: crystal spec
