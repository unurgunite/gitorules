name: CI

on:
  push:
    branches: [master, v*]
  pull_request:
    branches: [master, v*]

jobs:
  check-source:
    uses: FlorexLabs/shared-workflows/.github/workflows/check-source-branch.yml@master

  build:
    needs: check-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crystal: [1.12.0, 1.14.0]

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ matrix.crystal }}
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-${{ matrix.crystal }}-

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check

      - name: Lint
        run: bin/ameba

      - name: Test
        run: crystal spec
