name: CI

on: [push, pull_request]

jobs:
  check-source:
    if: github.base_ref == 'master'
    uses: FlorexLabs/shared-workflows/.github/workflows/check-source-branch.yml@master

  build:
    needs: check-source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crystal: [1.14.0, 1.20.0]

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal ${{ matrix.crystal }}
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-${{ matrix.crystal }}-

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        if: matrix.crystal == '1.20.0'
        run: crystal tool format --check

      - name: Lint
        run: bin/ameba

      - name: Test
        run: crystal spec
