# gitorules configuration
# Manage GitHub branch rulesets declaratively across repositories.
#
# Usage:
#   gitorules status          # Show current ruleset state
#   gitorules apply           # Apply configuration
#   gitorules apply --dry-run # Preview changes without applying

# Single-org mode:
#   org: unurgunite
#   repos:
#     - docscribe
#   rules:
#     default_branch:
#       merge: only

# Multi-org mode (uncomment to use):
orgs:
  unurgunite:
    repos:
      - docscribe
      - irb-autosuggestions
      - gitorules
    rules:
      default_branch:
        merge: only
        checks:
          - "check / check"
      release:
        pattern: v*
        squash: only
      system:
        pattern: system/*
        merge: only
